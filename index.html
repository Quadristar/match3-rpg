<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b1e2b" />
    <title>match3-rpg</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1b1e2b;
        color: #e8eaf2;
        font-family: system-ui, sans-serif;
        /* スクロール・ピンチズーム・長押しメニューを抑止する */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #app canvas {
        display: block;
      }
      /* 起動失敗時のメッセージ(スマホでは開発者ツールが使えないため画面に出す) */
      .boot-error {
        box-sizing: border-box;
        padding: 16px;
        font-size: 14px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
        -webkit-user-select: text;
        user-select: text;
      }
      /* 起動後のエラーの表示(画面の下部に重ねる。スマホでは開発者ツールが使えないため) */
      .error-panel {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10;
        box-sizing: border-box;
        max-height: 60%;
        overflow-y: auto;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
        background: rgba(40, 12, 16, 0.94);
        border-top: 2px solid #e05a5a;
        font-size: 13px;
        line-height: 1.5;
        /* パネルの中だけは縦のスクロールと文字の選択を許す */
        touch-action: pan-y;
        -webkit-user-select: text;
        user-select: text;
      }
      .error-panel-text {
        white-space: pre-wrap;
        word-break: break-word;
      }
      .error-panel-buttons {
        display: flex;
        gap: 12px;
        margin-top: 12px;
      }
      .error-panel-buttons button {
        flex: 1;
        padding: 10px;
        font-size: 14px;
        color: inherit;
        background: #3a3f55;
        border: 1px solid #6b7190;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
